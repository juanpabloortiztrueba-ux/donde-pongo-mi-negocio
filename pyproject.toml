[project]
name = "donde-pongo-mi-negocio"
version = "0.1.0"
description = "Modelo local que sugiere dónde poner un negocio en la ZM del Valle de México"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "folium>=1.0.0",
    "geopandas>=1.2.0",
    "h3>=4.5.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pypdf>=7.1.1",
    "pyproj>=3.8.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
    "tqdm>=4.70.1",
]

["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
