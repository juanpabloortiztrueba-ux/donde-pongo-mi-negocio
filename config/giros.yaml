    rubro_enigh_nota: "cafe_bebidas de la ENIGH es café para preparar en casa; el consumo en cafetería cae en ali_fuera_total (restaurantes y similares)."
    ticket_promedio_mxn: 95
    ticket_fuente: "supuesto: una bebida y un alimento ligero"
    radio_influencia_m: 400
    demanda_base: diurna
    notas: "La clase 722515 mezcla cafeterías, neverías y refresquerías (por nombre, 26 % dicen 'cafe'). Complementarios: universidades, oficinas, despachos, cafés internet, librerías, bibliotecas y museos."

