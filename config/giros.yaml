# Catalogo de giros del modelo "Donde pongo mi negocio".
# Etapa Giros G. Se valida con: uv run python scripts/validar_giros.py
#
# Convenciones (ver docs/BITACORA.md, bloque "Giros G"):
#  - scian: clases de 6 digitos (SCIAN 2023, el que usa el DENUE actual) que SON el giro (competencia).
#  - scian_con_filtro (opcional): clases compartidas con otros giros; solo cuentan los
#    establecimientos cuyo `nombre` cumple el regex (sin distinguir mayusculas). Sin filtro, ese
#    giro seria identico a otro, porque el DENUE los clasifica en la misma clase.
#  - complementarios: clases de 6 digitos que atraen a su cliente (no son competencia).
#  - cliente_objetivo: peso por grupo de edad del Censo (0-14, 15-24, 25-59, 60+); suma 1.
#    Los grupos son los de agebs_base (pob_0_14, pob_15_24, pob_25_59, pob_60_mas).
#  - nse_objetivo: peso por nivel socioeconomico (bajo, medio, alto); suma 1. Es criterio del
#    autor segun el tipo de gasto y el precio del giro, no un dato medido.
#  - rubro_enigh: clave de rubro_clave en data/processed/enigh_gasto.parquet (validada).
#    rubro_enigh_alt: otras claves utiles. rubro_enigh_nota: advertencia sobre la cobertura.
#  - ticket_promedio_mxn: pesos por visita/compra (o por mes en servicios de cuota). No hay una
#    fuente abierta unica por giro: todos van como supuesto en ticket_fuente. Hay que validarlos
#    con precios reales antes de usarlos para algo mas que ordenar zonas.
#  - radio_influencia_m: metros a la redonda donde un negocio capta clientes y compite; supuesto
#    razonado (caminata de 5-10 min para consumo diario; auto/transporte para destino).
#  - demanda_base (opcional): "residente" (default) o "diurna" si el cliente es la poblacion que
#    trabaja o estudia en la zona.

version: 1
fecha: "2026-11-23"
scian_version: "SCIAN 2023 (el del DENUE corte 05/2026, data/processed/scian.csv)"
rangos_edad: ["0-14", "15-24", "25-59", "60+"]

giros:

  - clave: heladeria
    nombres: [heladeria, heladerias, neveria, paleteria, helados, nieves]
    scian: ["461170"]
    scian_con_filtro:
      - codigos: ["722515"]
        nombre_regex: "\\bhelad|neveri|nieves|paleter"
    complementarios: ["611111", "611121", "712131", "531113", "465212", "713120"]
    cliente_objetivo: {"0-14": 0.30, "15-24": 0.30, "25-59": 0.35, "60+": 0.05}
    nse_objetivo: {bajo: 0.25, medio: 0.50, alto: 0.25}
    rubro_enigh: helados
    rubro_enigh_alt: [ali_fuera_total]
    rubro_enigh_nota: "helados de la ENIGH es consumo en casa y solo 2-7 % de hogares reporta gasto; sirve para ordenar deciles, no para dimensionar."
    ticket_promedio_mxn: 70
    ticket_fuente: "supuesto: una nieve o helado artesanal individual, 2026"
    radio_influencia_m: 500
    notas: "Complementarios: escuelas de preescolar y primaria privadas, zoológicos y jardines, salones de fiestas, jugueterías y casas de juegos. Estacional (calor)."

