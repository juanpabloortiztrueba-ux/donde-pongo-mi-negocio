# 28 preguntas de evaluacion del agente: las 20 del contrato (etapa Agente H) y 8 nuevas (2026-11-23, ids 21-28)
# que cubren los fallos de docs/REVISION_CRITICA_2026-11-23.md. Las corre eval/evaluar.py.
# tipo: giro (top de colonias), sugerir (sin giro), macro, trampa (fuera de alcance).
# giro: clave esperada en recomendar_zonas; municipio: cvegeo_mun al que deben pertenecer las AGEB citadas;
# nse: filtro esperado en recomendar_zonas.
# colonia: {regex, muns}: la colonia pedida; regex sobre el nombre normalizado de nom_colonia en agebs_features y
#   muns = cvegeo_mun donde buscarla. El evaluador calcula su centroide y exige AGEB a <= 2 km.
# colonia_inexistente: nombre inventado; la respuesta debe decir que no se encontro y que da a cambio.
# historial: turnos anteriores (como los pasa la UI); la pregunta es un seguimiento.
# grupo: colonia | seguimiento -> TODAS deben pasar para aprobar (ademas del 90 % general).
